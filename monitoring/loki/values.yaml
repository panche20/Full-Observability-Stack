# Fixed values for loki-stack with Promtail 3.x
loki:
  enabled: true
  isDefault: false

  # Use simple scalable mode for single instance
  deploymentMode: SingleBinary

  loki:
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096

    common:
      instance_addr: 127.0.0.1
      path_prefix: /tmp/loki
      storage:
        filesystem:
          chunks_directory: /tmp/loki/chunks
          rules_directory: /tmp/loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    query_range:
      results_cache:
        cache:
          embedded_cache:
            enabled: true
            max_size_mb: 100

    schema_config:
      configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

    limits_config:
      retention_period: 168h
      allow_structured_metadata: false
      volume_enabled: true

    ruler:
      alertmanager_url: http://localhost:9093

  singleBinary:
    replicas: 1
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"

  # Disable gateway for simplicity
  gateway:
    enabled: false

  # Disable minio (use filesystem)
  minio:
    enabled: false

  # Disable read/write/backend (single binary mode)
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0

# Promtail configuration
promtail:
  enabled: true

  config:
    # Where to send logs
    clients:
    - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push

    # Server config for health endpoints
    server:
      http_listen_port: 3101
      grpc_listen_port: 0

    positions:
      filename: /run/promtail/positions.yaml

    # What to scrape
    scrape_configs:
    - job_name: kubernetes-pods
      kubernetes_sd_configs:
      - role: pod

      pipeline_stages:
      # Try to parse JSON logs
      - json:
          expressions:
            level: level
            service: service
            event: event

      # Add parsed fields as labels
      - labels:
          level:
          service:
          event:

      relabel_configs:
      # Only scrape pods with log annotation or all pods
      - source_labels: [__meta_kubernetes_namespace]
        action: keep
        regex: url-shortener|monitoring

      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace

      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

      - source_labels: [__meta_kubernetes_pod_container_name]
        target_label: container

      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: app

      # Set the path to the log file
      - source_labels:
          - __meta_kubernetes_pod_uid
          - __meta_kubernetes_pod_container_name
        target_label: __path__
        replacement: /var/log/pods/*$1*/$2/*.log
        separator: /

  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# Grafana — disabled here, already installed via kube-prometheus-stack
grafana:
  enabled: false
